name: predict

# One hourly tick; `python -m matchpredictor gate` (stdlib only, runs before installing anything)
# decides whether this tick is the 09:00 ET daily run, a pre-kickoff refresh (a kickoff 45-105 min
# away: picks up confirmed lineups and re-predicts), or nothing.
# Manual modes: daily | prekickoff | results | backtest | netcheck | afsample (API-Football parsing check)
# | backfill (API-Football history for the team list -> data/history/api_football archives).
# The gate also picks backfill once a week (first Monday tick from 06:00 ET, see schedule.py).
# Only runs on main commit data and deploy Pages; runs on other branches are read-only checks
# (their results go to the job log and an artifact).
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "daily | prekickoff | results | backtest | netcheck | afsample | backfill"
        default: daily

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: predict-${{ github.ref }}
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      mode: ${{ steps.gate.outputs.mode }}
    steps:
      # the branch head at start time, not the commit the run was triggered on: runs are queued one at a time,
      # so each starts from the data the previous run committed (a stale copy once overwrote a fresh match.db)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Decide what to run
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            mode="${{ github.event.inputs.mode }}"
          else
            mode="$(python3 -m matchpredictor gate)"
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "Mode: $mode"

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.mode != 'skip'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        if: steps.gate.outputs.mode != 'skip'
        run: pip install -r requirements.txt

      - name: Network check
        if: steps.gate.outputs.mode == 'netcheck' || steps.gate.outputs.mode == 'backtest'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m matchpredictor netcheck

      # Understat / ClubElo / API-Football history caches (immutable or slow-changing raw responses)
      - uses: actions/cache@v4
        if: steps.gate.outputs.mode != 'skip' && steps.gate.outputs.mode != 'netcheck'
        with:
          path: |
            data/cache
            data/detail.db
          key: data-cache-${{ github.run_id }}
          restore-keys: data-cache-

      - name: Tests
        if: steps.gate.outputs.mode != 'skip' && steps.gate.outputs.mode != 'netcheck'
        run: python -m pytest -q

      - name: Data backfill
        if: steps.gate.outputs.mode == 'backfill' || steps.gate.outputs.mode == 'afsample'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          if [ "${{ steps.gate.outputs.mode }}" = "afsample" ]; then
            python -m matchpredictor detail --apifootball-sample > out.json
          else
            python -m matchpredictor detail --load --download --apifootball --export > out.json   # + new Understat matches
            python -m matchpredictor warehouse >> out.json      # clean unified tables + cross-source checks
          fi
          cat out.json
          { echo '```'; cat out.json; echo '```'; du -sh data/history/api_football 2>/dev/null || true; } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.gate.outputs.mode }}" = "backfill" ]; then
            { echo; echo "## Data audit"; python -m matchpredictor audit; } | tee -a "$GITHUB_STEP_SUMMARY"
            date -u +%Y-%m-%dT%H:%M:%SZ > data/history/last_backfill.txt     # the gate's weekly clock
          fi

      - name: Run pipeline
        if: steps.gate.outputs.mode == 'daily' || steps.gate.outputs.mode == 'prekickoff' || steps.gate.outputs.mode == 'results'
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: python -m matchpredictor run --mode "${{ steps.gate.outputs.mode }}"

      - name: Backtest (on demand, weekly on Mondays, or when missing)
        if: steps.gate.outputs.mode == 'backtest' || steps.gate.outputs.mode == 'daily'
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: |
          if [ "${{ steps.gate.outputs.mode }}" = "backtest" ] || [ "$(date -u +%u)" = "1" ] || [ ! -f site/data/backtest.json ]; then
            python -m matchpredictor backtest --refresh --markdown backtest.md
            cat backtest.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload backtest report
        if: steps.gate.outputs.mode == 'backtest'
        uses: actions/upload-artifact@v4
        with:
          name: backtest-${{ github.run_id }}
          path: |
            backtest.md
            site/data/backtest.json

      - name: Commit data
        if: github.ref == 'refs/heads/main' && steps.gate.outputs.mode != 'skip' && steps.gate.outputs.mode != 'netcheck' && steps.gate.outputs.mode != 'afsample'
        run: |
          git config user.name "match-predictor bot"
          git config user.email "actions@users.noreply.github.com"
          # backfill runs only add archives: their match.db changes are request counters, never results
          if [ "${{ steps.gate.outputs.mode }}" = "backfill" ]; then git add data/history/; else git add data/match.db site/data/ data/history/; fi
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "data: ${{ steps.gate.outputs.mode }} run $(date -u +%Y-%m-%dT%H:%MZ)"
            # another run may have pushed meanwhile: merge it, keeping this run's (newer) data files
            for i in 1 2 3; do
              git push && break
              git pull --no-rebase --no-edit -X ours origin main
            done
          fi

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && steps.gate.outputs.mode != 'skip' && steps.gate.outputs.mode != 'netcheck'
        with:
          path: site

  deploy:
    needs: predict
    if: github.ref == 'refs/heads/main' && needs.predict.outputs.mode != 'skip' && needs.predict.outputs.mode != 'netcheck'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
